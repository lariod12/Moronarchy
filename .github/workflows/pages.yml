# Publishes the single-file "Play vs bots" prototype to GitHub Pages on every push to main,
# so it can be opened on a phone from anywhere: https://lariod12.github.io/Moronarchy/
name: Deploy solo prototype to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:solo
        env:
          VITE_BUILD_ID: ${{ github.sha }}
      - name: Prepare site
        run: |
          mkdir -p _site
          cp apps/web/dist-solo/moronarchy-solo.html _site/index.html
          echo "{\"build\":\"${{ github.sha }}\"}" > _site/version.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
